<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام التطوّر اليومي</title>
<meta name="description" content="خطة يومية حول نوبات العمل والجامعة: النوم، العادات، الأهداف، المال.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17212A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التطوّر">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky tab bar over one 1100px column; days are generated from the 2/2 shift rotation + the week's lectures */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --sunk:#E3E9EE; --ink:#13202B; --muted:#5A6B78; --line:#D3DCE3;
  --accent:#B87309; --accent-ink:#FFFFFF; --accent-soft:#F6E8CF;
  --good:#2F7D4F; --warn:#B4530F; --bad:#B42318; --warn-soft:#FBE7D6;
  --c-uni:#2F5DA8; --c-work:#5B6B7A; --c-deep:#B87309; --c-ru:#B42335; --c-body:#2F7D4F; --c-money:#0F7C80; --c-routine:#7A5BA8; --c-rest:#8A8F94; --c-move:#9AA6B0;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#17212A; --sunk:#1E2A34; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3946;
  --accent:#E3A13A; --accent-ink:#1A1205; --accent-soft:#3A2C14;
  --good:#5BC189; --warn:#F0A060; --bad:#F2766B; --warn-soft:#3A2416;
  --c-uni:#6F9BE8; --c-work:#9AAAB8; --c-deep:#E3A13A; --c-ru:#F07383; --c-body:#5BC189; --c-money:#4CC3C6; --c-routine:#B396E4; --c-rest:#A3A9AE; --c-move:#6B7884;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#17212A; --sunk:#1E2A34; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3946;
  --accent:#E3A13A; --accent-ink:#1A1205; --accent-soft:#3A2C14;
  --good:#5BC189; --warn:#F0A060; --bad:#F2766B; --warn-soft:#3A2416;
  --c-uni:#6F9BE8; --c-work:#9AAAB8; --c-deep:#E3A13A; --c-ru:#F07383; --c-body:#5BC189; --c-money:#4CC3C6; --c-routine:#B396E4; --c-rest:#A3A9AE; --c-move:#6B7884;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-size:1.45rem;margin:0;font-weight:700}
.brand h1 span{color:var(--accent)}
.sync{font-size:.78rem;color:var(--muted)}
.sync[data-mode="on"]::before{content:"● ";color:var(--good)}
.sync[data-mode="off"]{color:var(--warn);font-weight:600}
.sync[data-mode="off"]::before{content:"● "}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 .92rem var(--f-body);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0 0 4px;text-wrap:balance}
h3{font-size:1.02rem;margin:0;font-weight:700}
.lead{color:var(--muted);margin:0 0 18px;max-width:70ch}
.eyebrow{font-size:.75rem;color:var(--muted);letter-spacing:.02em;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=time],input[type=number],input[type=date]{direction:ltr;font-family:var(--f-mono);font-size:.9rem}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;font:600 .88rem var(--f-body);cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
.btn.ghost.del:hover{color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 4px;font-size:.84rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.work{background:var(--c-work);color:#fff}
.chip.rec{background:var(--accent-soft);color:var(--accent)}
.chip.focus{background:var(--accent);color:var(--accent-ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--cat,var(--muted));display:inline-block}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.banner b{color:var(--warn)}

/* Today */
.today-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.today-head .date{font-family:var(--f-display);font-size:1.6rem;line-height:1.2}
.today-head .ru{color:var(--muted);font-size:.9rem}
.score{display:flex;align-items:center;gap:12px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:600 .95rem var(--f-mono)}
.blocks{display:flex;flex-direction:column}
.block{display:grid;grid-template-columns:auto 4px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
.block .t{font:500 .8rem var(--f-mono);color:var(--muted);direction:ltr;min-width:86px;text-align:left}
.block .bar{align-self:stretch;border-radius:2px;background:var(--cat)}
.block .ttl{min-width:0}
.block.now{background:var(--accent-soft);border-radius:8px}
.block.now .t{color:var(--ink)}
.block.done .ttl{color:var(--muted);text-decoration:line-through}
.block.conflict .ttl{color:var(--bad);font-weight:600}
.tick{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:.85rem;padding:0;color:var(--ink)}
.tick[data-v="1"]{background:var(--good);border-color:var(--good);color:#fff}
.tick[data-v="m"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.habit-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.habit-row:last-child{border-bottom:0}
.habit-row small{display:block;color:var(--muted);font-size:.78rem}
.warn{color:var(--warn);font-weight:600}
.legend{font-size:.8rem;color:var(--muted)}
.left{font-size:.82rem;color:var(--warn);margin-top:8px}

/* Week */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.weeknav .lbl{font-family:var(--f-display);font-size:1.1rem;min-width:190px;text-align:center}
.lec{display:grid;grid-template-columns:150px auto auto 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.lec input[type=text]{width:100%}
@media (max-width:640px){.lec{grid-template-columns:1fr 1fr auto}.lec input[type=text]{grid-column:1/-1;order:-1}.lec select{grid-column:1/-1}}
.daycards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dc.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dc.today .dn::after{content:" · اليوم";color:var(--accent);font-size:.8rem}
.dc .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.dc .dn{font-weight:700}
.dc .dn small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.mini{display:flex;flex-direction:column;gap:2px;font-size:.8rem}
.mini div{display:grid;grid-template-columns:44px 8px 1fr;gap:6px;align-items:center}
.mini .t{font:400 .72rem var(--f-mono);color:var(--muted);direction:ltr;text-align:left}
.mini span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini .x{color:var(--bad);font-weight:600}
.dc .acts{display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.ed-row{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ed-row input[type=text]{width:100%}
@media (max-width:640px){.ed-row{grid-template-columns:1fr 1fr auto}.ed-row input[type=text]{grid-column:1/-1;order:-1}.ed-row select{grid-column:1/3}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--sunk);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font:600 1.15rem var(--f-mono);direction:ltr;text-align:right}
.kpi span{font-size:.78rem;color:var(--muted)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.task{display:grid;grid-template-columns:1fr 150px 80px auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
@media (max-width:640px){.task{grid-template-columns:1fr 70px auto}.task input[type=text]{grid-column:1/-1}}
.ut.done input{color:var(--muted);text-decoration:line-through}
@media (max-width:640px){.lec.ut{grid-template-columns:auto 1fr 1fr auto!important}.lec.ut>div{grid-column:1/-1;order:-1}}
.asset{display:grid;grid-template-columns:1fr 140px 110px 76px auto auto auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.asset.debt{grid-template-columns:1fr 120px 80px auto auto auto}
.asset .liq{display:flex;gap:4px;align-items:center;font-size:.8rem;color:var(--muted);white-space:nowrap}
@media (max-width:760px){.asset{grid-template-columns:1fr 1fr auto}.asset>input[type=text]{grid-column:1/-1}.asset.debt{grid-template-columns:1fr 1fr auto}}
.road{display:flex;flex-direction:column;gap:4px}
.lvl{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px;border-radius:8px}
.lvl .lv{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:.8rem}
.lvl.ok .lv{background:var(--good);color:#fff}
.lvl.ok b{color:var(--muted)}
.lvl.cur{background:var(--accent-soft)}
.lvl.cur .lv{background:var(--accent);color:var(--accent-ink)}
.lvl .pbar{margin-top:4px}
.simt{width:100%;border-collapse:collapse;margin-top:12px;font-size:.86rem}
.simt th,.simt td{padding:6px;border-bottom:1px solid var(--line);text-align:right}
.simt th{color:var(--muted);font-weight:600}
.acc{margin:8px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.tips{border-inline-start:4px solid var(--accent)}
.tips ul{margin:6px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.cfocus{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:8px 0 10px}
.cfocus b{font-size:1rem;line-height:1.5}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ct{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:7px;background:var(--sunk);border-inline-start:3px solid var(--ct);font-size:.9rem}
.ct .cl{font-size:.7rem;font-weight:700;color:var(--ct);white-space:nowrap;padding-top:2px;min-width:38px}
.ct.urgent{--ct:var(--bad)} .ct.warn{--ct:var(--warn)} .ct.focus{--ct:var(--accent)} .ct.info{--ct:var(--c-uni)} .ct.good{--ct:var(--good)}
.cmore{margin-top:8px}
.cmore>summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
.cmore .clist{margin-top:6px}
.cbase{margin:6px 0 0;padding-inline-start:18px;font-size:.86rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.dfocus{font-size:.78rem;background:var(--accent-soft);border-radius:6px;padding:4px 8px;line-height:1.5}
.dfocus span{color:var(--accent);font-weight:700}
.review{border-inline-start:4px solid var(--c-routine)}
.review ul{margin:4px 0 0;padding-inline-start:18px}
.mline{display:grid;grid-template-columns:1fr 130px auto;gap:6px;align-items:center;padding:4px 0}
details.cfg>summary{cursor:pointer;font-weight:700;list-style:none}
details.cfg>summary::before{content:"◂ ";color:var(--muted)}
details.cfg[open]>summary::before{content:"▾ "}

/* Habits */
.hgrid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.hgrid{border-collapse:collapse;font-size:.82rem;min-width:100%}
.hgrid th,.hgrid td{padding:4px;text-align:center;border-bottom:1px solid var(--line)}
.hgrid th.hn,.hgrid td.hn{text-align:right;position:sticky;right:0;background:var(--surface);min-width:170px;max-width:230px;padding-inline:10px;z-index:1}
.hgrid thead th{font:500 .7rem var(--f-mono);color:var(--muted);direction:ltr}
.hgrid thead th.wd{color:var(--c-work);text-decoration:underline}
.cell{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;padding:0;display:block;margin:auto}
.cell[data-v="1"]{background:var(--good);border-color:var(--good)}
.cell[data-v="m"]{background:var(--accent);border-color:var(--accent);opacity:.55}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.future{opacity:.35;cursor:default}
.cell.na{background:transparent;border-style:dashed;cursor:default;opacity:.4}
.streak{font:600 .8rem var(--f-mono);color:var(--accent)}
.hedit{display:grid;grid-template-columns:1fr 1fr 140px 130px auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
@media (max-width:700px){.hedit{grid-template-columns:1fr 1fr auto}.hedit input{grid-column:1/-1}}

/* Goals */
.vision{border-inline-start:4px solid var(--accent)}
.vision textarea{font-family:var(--f-display);font-size:1.15rem;line-height:1.6;border:0;background:transparent;padding:0;min-height:80px}
.goal{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.goal:last-of-type{border-bottom:0}
.goal .gt{font-weight:700;width:100%;border:0;background:transparent;padding:0;font-size:1rem}
.pbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.gfields{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.gfields input[type=number]{width:110px}
.gfields input.u{width:80px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.fi-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fi-in label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0}

/* Roadmap */
.phase{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .when{font-family:var(--f-display);color:var(--accent);font-size:1.05rem;line-height:1.3}
.phase .when small{display:block;color:var(--muted);font-family:var(--f-body);font-size:.78rem}
@media (max-width:640px){.phase{grid-template-columns:1fr;gap:6px}}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:3px 0}
.item input[type=text]{border-color:transparent;background:transparent;width:100%;padding:3px 6px}
.item input[type=text]:hover,.item input[type=text]:focus{border-color:var(--line);background:var(--surface)}
.item.done input[type=text]{color:var(--muted);text-decoration:line-through}
.item .tick{width:22px;height:22px;margin-top:4px}

/* Resources */
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--accent)}
.res a:hover{color:var(--accent)}
.res p{grid-column:1/-1;margin:0;color:var(--muted);font-size:.86rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- PWA additions ---- */
.alloc{display:flex;flex-direction:column;gap:8px}
.alloc .a{display:grid;grid-template-columns:minmax(110px,1.2fr) 2fr 44px;gap:8px;align-items:center;font-size:.86rem}
.alloc .track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:block}
.alloc .track i{display:block;height:100%;background:var(--cat)}
nav.tabs button{min-height:44px}
.tick{min-width:26px}
@media (max-width:640px){.tick{width:34px;height:34px}.item .tick{width:28px;height:28px}.cell{width:26px;height:26px}.btn{padding:9px 13px}.btn.ghost{padding:8px 10px}.btn.link{padding:8px 6px}}
/* stats */
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:190px;margin-top:10px}
.wbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.wbar .col{width:100%;max-width:44px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.wbar.low .col{background:var(--warn)} .wbar.hi .col{background:var(--good)}
.wbar.na .col{background:var(--sunk);height:3px!important}

/* ---------- state + persistence ---------- */

function norm(x){
  const D = defaults(); x = Object.assign(D, x);
  const st = x.settings || {};
  if (!st.ver || st.ver < 2) Object.assign(st, {shiftS:"22:00", shiftE:"10:00", sleep:"23:00", napH:4, recNapH:4});

  x.settings = Object.assign(defaults().settings, st);
  x.tasks = Object.assign(defaults().tasks, x.tasks || {});

  x.big.forEach(g => { if (!Array.isArray(g.log)) g.log = []; });
  x.logs = x.logs || {}; x.days = x.days || {}; x.lectures = x.lectures || {};
  return x;

/* PWA: everything is stored on this device only (localStorage). No account, no server. */
function setSync(t, mode){ const el = $("#sync"); if (el) { el.textContent = t; el.dataset.mode = mode || ""; } }

  try { snapToday(); } catch(e) {}
  try { localStorage.setItem(LS, JSON.stringify(state)); setSync(navigator.onLine === false ? "بدون إنترنت · محفوظ على هذا الجهاز" : "محفوظ على هذا الجهاز", "on"); }

/* ---------- rotation + day generator ---------- */

function dayType(d){ const o = state.days[keyOf(d)]; return (o && o.type) || baseType(d); }
function kindOf(d){ return dayType(d) === "work" ? "work" : (dayType(addDays(d,-1)) === "work" ? "rec" : "focus"); }
function weekKey(d){ return keyOf(weekStart(d)); }
function lecturesOn(d){ const w = state.lectures[weekKey(d)]; const k = keyOf(d); return w && w.items ? w.items.filter(l => l.d === k && l.s && l.e).sort((a,b) => toMin(a.s)-toMin(b.s)) : []; }
const blk = (s, e, t, c, extra) => Object.assign({id:fmtT(s) + "|" + t, s:fmtT(s), e:fmtT(e), t, c}, extra || {});

function genDay(d, need){
  const k = keyOf(d), o = state.days[k], kind = kindOf(d);
  if (o && o.custom) { const st0 = S(), nt = toMin(st0.shiftE) <= toMin(st0.shiftS), pw = dayType(addDays(d,-1)) === "work";

  const st = S(), cm = +st.commute || 0, uc = +st.uniCommute || 0;
  const ss = toMin(st.shiftS), se = toMin(st.shiftE), night = se <= ss;
  const lecs = lecturesOn(d);
  const prevW = dayType(addDays(d,-1)) === "work", curW = kind === "work", nextW = dayType(addDays(d,1)) === "work";
  const hard = [], fixed = [], wins = [];
  let list = [], sub = kind;
  const H = (s,e,t,c,x) => hard.push(blk(s,e,t,c,x));
  const F = (s,e,t,c) => fixed.push(blk(s,e,t,c));
  const firstLec = lecs.length ? toMin(lecs[0].s) : 1440;
  const earlyWake = w => Math.max(0, Math.min(w, firstLec - uc - 45));

    }
    if (curW && prevW) {
      sub = "w2";
      const mw = toMin(st.midWake || "17:30");

      F(mw, mw+45, "استيقاظ، وجبة، استحمام (قيلولة 20 دقيقة فقط إن احتجت)", "routine");
      wins.push([mw+45, leave]); list = state.tasks.mid || [];
    } else if (curW) {
      sub = "w1";
      const w = earlyWake(toMin(st.wakeFocus)), nap = (+st.napH||3)*60, ns = toMin(st.napS || "14:30"), ne = Math.min(ns+nap, leave-45);
      F(w, w+45, "روتين صباحي وفطور (استيقظ في وقتك، لا تنم حتى الظهر)", "routine");
      H(ns, ne, "قيلولة العصر: غرفة مظلمة، بلا هاتف، الاستلقاء بهدوء يكفي إن لم تنم", "rest");
      F(ne, ne+45, "استيقاظ، ضوء وحركة، وجبة", "routine");
      wins.push([w+45, ns]); wins.push([ne+45, leave]); list = state.tasks.pre || [];
    } else if (prevW) {
      sub = "rec";
      const rn = (+st.recNapH||4)*60, sl = toMin(st.sleep);

    if (nm < 12*60 && !(L.p || []).some(x => x && x.trim()) && g.sub !== "w2") add("info", "اكتب أهم 3 أولويات اليوم قبل أن تبدأ، وضع الجامعة أولاً.");
    if (nm >= 19*60 && !(L.note || "").trim()) add("info", (g.sub === "w1" || g.sub === "w2" ? "قبل الخروج للعمل" : "قبل النوم") + ": اكتب سطراً واحداً عمّا تعلّمته اليوم.");
    // habits
    const hs = state.habits.filter(h => applies(h, d) && !(L.h && L.h[h.id]));
    hs.filter(h => missedLast(h)).slice(0, 2).forEach(h => add("warn", "«" + h.n + "» فاتتك آخر مرة. لا تفوّتها مرتين: نفّذ نسختها المصغّرة الآن (" + h.m + ")."));
    if (nm >= 18*60) hs.filter(h => streak(h) >= 3 && !missedLast(h)).slice(0, 1).forEach(h => add("warn", "سلسلة «" + h.n + "» " + streak(h) + " أيام. لا تكسرها الليلة."));
    if (nm >= 19*60) hs.filter(h => h.c === "money").slice(0, 1).forEach(h => add("info", "سجّل مصاريف اليوم قبل أن تنساها."));
    // yesterday
    const y = dayPct(addDays(d, -1));
    if (nm < 14*60 && y.any && y.pct < 40) add("info", "أمس كان صعباً (" + y.pct + "%). اليوم اكتفِ بالجامعة والحد الأدنى من كل عادة.");
    // shift timing
    const st = S(), night = toMin(st.shiftE) <= toMin(st.shiftS);
    if (night && dayType(addDays(d,-1)) === "work" && nm < toMin(st.shiftE)) add("info", nm >= 5*60 ? "لا كافيين بعد الآن حتى تنام صباحاً." : "خذ استراحة قصيرة وماء وحركة كل ساعتين في النوبة.");
  }
  // leftovers and tomorrow
  if (g.left.length) { const nf = nextKind(d, "focus");
    add("info", "لم يتّسع اليوم لـ: " + g.left.join("، ") + (nf ? ". انقلها ليوم الإنتاج " + dLabel(nf) + "." : ".")); }
  if (!isToday || nm >= 16*60) {
    const tl = tg.blocks.filter(b => b.lec);
    const tc = tg.blocks.filter(b => b.conflict);
    if (tl.length || tc.length) add(tc.length ? "warn" : "info", "غداً: " + tl.concat(tc).sort((a,b) => toMin(a.s) - toMin(b.s)).map(b => lname(b) + " " + b.s).join("، ") + (tc.length ? ". محاضرة منها تتعارض مع نومك، فقرّر الليلة كيف ستتعامل معها." : ". جهّز ما تحتاجه الليلة."));
    if (tg.sub === "w1") add("info", "غداً أول نوبة: نَم الليلة في موعدك واستيقظ عادياً، والقيلولة الساعة " + (S().napS || "14:30") + ".");
    if (tg.sub === "focus" && g.sub !== "focus") add("info", "غداً يوم الإنتاج: اكتب الليلة أول مهمة ستبدأ بها صباحاً.");
  }
  if (dayIdx(d) === 6 && g.sub !== "w2") add("info", "اليوم الأحد: المراجعة الأسبوعية، وأدخل محاضرات الأسبوع القادم وواجباته.");
  if (!tips.length) add("good", "لا شيء عاجل. نفّذ الخطة كما هي.");
  const seen = new Set();
  const list = tips.filter(x => !seen.has(x.t) && seen.add(x.t)).sort((a,b) => LVL[a.lvl] - LVL[b.lvl]);
  return {focus, tips:list, base:SUBTIPS[g.sub] || [], sub:g.sub};
}

const ATYPES = {cash:"نقد", bank:"حساب بنكي", deposit:"وديعة", invest:"أسهم وصناديق وسندات", crypto:"عملات رقمية", gold:"ذهب ومعادن", property:"عقار", car:"سيارة وممتلكات", recv:"أموال لك عند الآخرين", other:"أخرى"};
const ACOL = {cash:"--c-money", bank:"--c-uni", deposit:"--c-routine", invest:"--c-deep", crypto:"--c-ru", gold:"--accent", property:"--c-body", car:"--c-work", recv:"--c-rest", other:"--c-move"};
const CURS = ["RUB","USD","EUR","USDT"];
const CUR_SYM = {RUB:"₽", USD:"$", EUR:"€", USDT:"USDT"};
const M = () => state.money;
const toRub = (v, cur) => (+v||0) * (cur === "RUB" ? 1 : cur === "USDT" ? (+M().rates.USD||0) : (+M().rates[cur]||0));
function yearsToFI(nw, monthly, exp, retPct){
  const target = exp*12*25; if (target <= 0) return null;
  const mr = Math.pow(1 + retPct/100, 1/12) - 1; let bal = Math.max(0, nw), k = 0;
  if (bal >= target) return 0;
  while (bal < target && k < 12*70) { bal = bal*(1+mr) + monthly; k++; if (monthly <= 0 && mr <= 0) break; }
  return bal >= target ? k/12 : null;
}
function moneyCalc(){
  const m = M();
  const assets = m.assets.reduce((a,x) => a + toRub(x.v, x.cur), 0);
  const liquid = m.assets.filter(x => x.liq).reduce((a,x) => a + toRub(x.v, x.cur), 0);
  const debts = m.debts.reduce((a,x) => a + toRub(x.v, x.cur), 0);
  const inc = m.income.reduce((a,x) => a + (+x.v||0), 0), exp = m.expenses.reduce((a,x) => a + (+x.v||0), 0);
  const nw = assets - debts, monthly = inc - exp, rate = inc ? monthly/inc : 0;
  const target = exp*12*25;
  const byType = {};
  m.assets.forEach(x => { byType[x.type] = (byType[x.type]||0) + toRub(x.v, x.cur); });
  const passiveGross = m.assets.reduce((a,x) => a + toRub(x.v, x.cur) * (+x.rate||0) / 1200, 0);
  const depYear = m.assets.filter(x => x.type === "deposit" || x.type === "bank").reduce((a,x) => a + toRub(x.v, x.cur) * (+x.rate||0) / 100, 0);
  const taxYear = m.resident ? Math.max(0, depYear - 160000) * 0.13 : depYear * 0.15;
  const passive = passiveGross - taxYear/12;
  const debtCost = m.debts.reduce((a,x) => a + toRub(x.v, x.cur) * (+x.rate||0) / 1200, 0);
  return {assets, liquid, debts, inc, exp, nw, monthly, rate, target, years: yearsToFI(nw, monthly, exp, +m.ret||0),
    emerMonths: exp > 0 ? liquid/exp : null, byType, passiveGross, passive, taxYear, depYear, debtCost, cover: exp > 0 ? passive/exp : 0};
}

        <div style="margin-top:6px">${list.length ? list.map(r => `<div class="rem${r.at < tk ? " past" : ""}"><span class="t">${fmtT(Math.round((r.at - new Date(now().getFullYear(), now().getMonth(), now().getDate()).getTime()) / 60000) % 1440)}</span><span>${esc(r.title)}${r.body ? `<small style="display:block;color:var(--muted)">${esc(r.body)}</small>` : ""}</span></div>`).join("") : '<p class="legend">لا تذكيرات مفعّلة لهذا اليوم.</p>'}</div>
      </section>
    </div>
  </div>`;
}

/* ---------- events for the additions ---------- */
$("#view").addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act; if (a.slice(0, 2) !== "x-") return;
  const host = el.closest(".big"), g = host && (state.big || []).find(x => x.id === host.dataset.id);
  if (a === "x-sprev") sOff--;
  else if (a === "x-snext") sOff = Math.min(0, sOff + 1);
  else if (a === "x-snow") sOff = 0;
  else if (a === "x-goapp") { setTab("app"); return; }
  else if (a === "x-goweek") { setTab("week"); const d = document.querySelector("details.cfg"); if (d) { d.open = true; d.scrollIntoView({block: "start"}); } return; }
  else if (a === "x-dismiss") { const d = dismissed(); d[el.dataset.w] = 1; lsSet(LS + "-dis", d); }
  else if (a === "x-install") { if (deferred) { const p = deferred; deferred = null; p.prompt(); Promise.resolve(p.userChoice).then(() => render()).catch(() => {}); } return; }
  else if (a === "x-non") { enableNotif(); return; }
  else if (a === "x-noff") { N().on = false; save(); }
  else if (a === "x-ntest") { fire({id: "test-" + Date.now(), title: "تجربة التذكير", body: "هكذا ستظهر تذكيراتك."}); return; }
  else if (a === "x-ics") { icsExport(); return; }
  else if (a === "x-export") { exportBackup(); return; }
  else if (a === "x-import") { const i = document.getElementById("imp"); if (i) i.click(); return; }
  else if (a === "x-update") { if (swReg) swReg.update().then(() => setTimeout(() => location.reload(), 800)).catch(() => toast("لا اتصال بالإنترنت الآن")); else location.reload(); return; }
  else if (a === "x-badd") { state.big.push({id: "g" + uid(), n: "هدف جديد", ic: "🎯", tgt: 0, cur: 0, mo: 0, d: "", link: false, log: []}); save(); }
  else if (a === "x-bdel" && g) { if (!window.confirm("حذف هدف «" + g.n + "» وسجلّ إيداعاته؟")) return; state.big = state.big.filter(x => x !== g); save(); }
  else if (a === "x-dep" && g) { const i = document.getElementById("bv-" + g.id), v = i ? +i.value : 0; if (!v) { toast("اكتب مبلغ الإيداع"); return; }
    g.cur = (+g.cur || 0) + v; (g.log || (g.log = [])).push({k: keyOf(now()), v}); if (g.log.length > 200) g.log = g.log.slice(-200); save(); toast("أُضيف " + rub(v) + " إلى " + g.n); }
  else if (a === "x-undep" && g) { const x = (g.log || []).pop(); if (x) g.cur = Math.max(0, (+g.cur || 0) - x.v); save(); }
  else return;
  render();
});
$("#view").addEventListener("input", e => {
  const el = e.target, b = el.dataset.xb; if (!b || b === "nf" || b === "bd" || b === "bl") return;
  const host = el.closest(".big"), g = host && (state.big || []).find(x => x.id === host.dataset.id); if (!g) return;
  const v = el.value;
  if (b === "bn") g.n = v; else g[{bt: "tgt", bc: "cur", bm: "mo"}[b]] = v === "" ? 0 : Math.max(0, +v || 0);
  save(); refreshBig(g.id);
});
$("#view").addEventListener("change", e => {
  const el = e.target;
  if (el.id === "imp") { if (el.files && el.files[0]) importBackup(el.files[0]); el.value = ""; return; }
  const b = el.dataset.xb; if (!b) return;
  if (b === "nf") { const f = el.dataset.f; N()[f] = el.type === "checkbox" ? el.checked : el.type === "number" ? Math.max(0, +el.value || 0) : (el.value || N()[f]); }
  else if (b === "bd" || b === "bl") { const host = el.closest(".big"), g = host && state.big.find(x => x.id === host.dataset.id); if (!g) return;
    if (b === "bd") g.d = el.value; else g.link = el.checked; }
  else return;
  save(); render();
});

/* ---------- boot ---------- */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").then(reg => { swReg = reg; return navigator.serviceWorker.ready; })
    .then(reg => { swReg = reg; swReady = true; regPeriodic(); planReminders(); if (tab === "app") softRender(); }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { const g = e.data && e.data.goto; if (g) { const h = String(g).split("#")[1] || "today"; if (VIEWS[h]) setTab(h); } });
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { persisted = ok; if (tab === "app") softRender(); }).catch(() => {});
setSync(navigator.onLine === false ? "بدون إنترنت · محفوظ على هذا الجهاز" : "محفوظ على هذا الجهاز", "on");
setInterval(tickReminders, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { tickReminders(); if (tab === "today" || tab === "stats") softRender(); } });
setTimeout(tickReminders, 1500);

const h = (location.hash || "").slice(1); if (VIEWS[h]) tab = h;
render();
setInterval(() => { const a = document.activeElement; if (tab === "today" && !(a && a.matches("input,textarea,select"))) render(); }, 60000);
planReminders();
})();
</script>
